services:
  mysql:
    image: chayma2012/bee-mysql:latest  
    ports: ["3307:3306"]
    volumes: [mysql_data:/var/lib/mysql]

  backend:
    image: chayma2012/bee-backend:latest
    ports: [ "8081:8081" ]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bee_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root


volumes:
  mysql_data:
