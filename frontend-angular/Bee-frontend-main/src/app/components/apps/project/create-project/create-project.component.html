<app-breadcrumb [title]="'Create Project'" [items]="['Apps', 'Project']" [active_item]="'Create'"></app-breadcrumb>

<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-body">
          <form class="form theme-form">

            <!-- Project Name -->
            <div class="row">
              <div class="col">
                <div class="mb-3">
                  <label>Project Name</label>
                  <input
                    class="form-control"
                    type="text"
                    placeholder="Project name *"
                    name="projectName"
                    [(ngModel)]="project.projectName"
                    required
                  />
                </div>
              </div>
            </div>

            <!-- Budget -->
            <div class="row">
              <div class="col-sm-6">
                <div class="mb-3">
                  <label>Budget</label>
                  <input
                    class="form-control"
                    type="number"
                    placeholder="Budget *"
                    name="budget"
                    [(ngModel)]="project.budget"
                    required
                  />
                </div>
              </div>

              <!-- Status -->
              <div class="col-sm-6">
                <div class="mb-3">
                  <label>Status</label>
                  <select
                    class="form-control"
                    name="status"
                    [(ngModel)]="project.status"
                    required
                  >
                    <option value="" disabled selected>Choose status</option>
                    <option value="EN_ATTENTE">EN_ATTENTE</option>
                    <option value="EN_COURS">EN_COURS</option>
                    <option value="TERMINE">TERMINE</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Dates -->
            <div class="row">
              <div class="col-sm-6">
                <div class="mb-3">
                  <label>Start date</label>
                  <input
                    class="form-control"
                    type="date"
                    name="startDate"
                    [(ngModel)]="project.startDate"
                    required
                  />
                </div>
              </div>

              <div class="col-sm-6">
                <div class="mb-3">
                  <label>End date</label>
                  <input
                    class="form-control"
                    type="date"
                    name="endDate"
                    [(ngModel)]="project.endDate"
                    required
                  />
                </div>
              </div>
            </div>

            <!-- Team -->
            <div class="row">
              <div class="col">
                <div class="mb-3">
                  <label>Team</label>
                  <select
                    class="form-control"
                    name="teamId"
                    [(ngModel)]="teamId"
                    required
                  >
                    <option value="" disabled selected>Choose a team</option>
                    <option *ngFor="let t of teams" [value]="t.teamId">
                      {{ t.name }}
                    </option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Buttons -->
            <div class="row">
              <div class="col">
                <div class="text-end">
                  <button type="button" class="btn btn-success me-3" (click)="createProject()">
                    Add
                  </button>
                  <button type="button" class="btn btn-danger" (click)="cancel()">
                    Cancel
                  </button>
                </div>
              </div>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
